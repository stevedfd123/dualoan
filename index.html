<!DOCTYPE html>
<html lang="EN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5}
.screen{display:none;padding:20px;min-height:100vh;background:#fff}
.screen.active{display:block}
h1{margin-bottom:16px}
button{padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

.loan-card{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:14px
}
.loan-top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:#e3f2fd;color:#1565C0;
  display:flex;align-items:center;justify-content:center;font-weight:800
}
.repay-btn{background:#fde9e6;color:#1e4e9d;border-radius:999px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #eee}

.back{margin-bottom:10px;display:inline-block;font-size:20px;cursor:pointer}
.success{text-align:center;font-size:20px;margin-top:60px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="screen active" id="login">
  <h1>Loan App</h1>
  <input id="phone" placeholder="Enter mobile number" style="padding:12px;width:100%;margin-bottom:12px">
  <button onclick="login()">Login</button>
  <p id="login-error" style="color:red;margin-top:10px"></p>
</div>

<!-- MY ACCOUNT -->
<div class="screen" id="account">
  <h1>My Account</h1>
  <h2>Total Amount Due: ₹<span id="total">0</span></h2>
  <div id="loanList"></div>
</div>

<!-- PENDING -->
<div class="screen" id="pending">
  <div class="back" onclick="show('account')">← Back</div>
  <h1>Pending Repayment</h1>
  <p>Amount: ₹<span id="p-amount"></span></p>
  <p>Due Date: <span id="p-date"></span></p>
  <button onclick="show('payment')">Repay</button>
</div>

<!-- PAYMENT -->
<div class="screen" id="payment">
  <div class="back" onclick="show('pending')">← Back</div>
  <h1>Payment</h1>
  <p>Pay ₹<span id="pay-amount"></span></p>
  <input placeholder="Enter 12-digit UTR" maxlength="12" id="utr" style="padding:12px;width:100%;margin:10px 0">
  <button onclick="submit()">Submit</button>
</div>

<!-- SUCCESS -->
<div class="screen" id="success">
  <div class="success">
    ✅ Payment Submitted<br><br>
    <button onclick="show('account')">Back to Home</button>
  </div>
</div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSqEJvs5Tnz2x1oCo5xOURlss-qdpBeF8Ew2-7wllFw17LU_jaxJ0YF-Gw8ncqUpAru6LfK25HlL__U/pub?output=csv";

let sheetData={}
let userRow=null;
let selectedLoan=null;

const LOANS=[
  {provider:"Candy Park",logo:"H",repayment:41160,due:"2025-11-26"},
  {provider:"Cash Bay",logo:"C",repayment:0,due:"-"}
];

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

async function fetchSheet(){
  const res=await fetch(CSV_URL);
  const txt=await res.text();
  const lines=txt.trim().split("\n");
  const headers=lines[0].split(",");
  for(let i=1;i<lines.length;i++){
    const row=lines[i].split(",");
    const obj={};
    headers.forEach((h,j)=>obj[h.trim()]=row[j]?.trim());
    const mobile=obj["Mobile"]?.replace(/\D/g,"").slice(-10);
    if(mobile) sheetData[mobile]=obj;
  }
}

async function login(){
  await fetchSheet();
  const phone=document.getElementById("phone").value.replace(/\D/g,"").slice(-10);
  if(!sheetData[phone]){
    document.getElementById("login-error").textContent="Mobile not found";
    return;
  }
  userRow=sheetData[phone];
  bindCashBay();
  renderLoans();
  show("account");
}

function bindCashBay(){
  const cb=LOANS.find(l=>l.provider==="Cash Bay");
  cb.repayment=Number(userRow["Repayment Amount"]||0);
  cb.due=userRow["Due Date"]||"-";
}

function renderLoans(){
  let total=LOANS.reduce((s,l)=>s+l.repayment,0);
  document.getElementById("total").textContent=total.toLocaleString("en-IN");
  const box=document.getElementById("loanList");
  box.innerHTML="";
  LOANS.forEach(l=>{
    const div=document.createElement("div");
    div.className="loan-card";
    div.innerHTML=`
      <div class="loan-top">
        <div class="brand">
          <div class="logo">${l.logo}</div>
          <strong>${l.provider}</strong>
        </div>
        <button class="repay-btn" ${l.provider!=="Candy Park"?"disabled":""}
        onclick="openLoan('${l.provider}')">Repay</button>
      </div>
      <div class="row"><span>Repayment</span><span>₹${l.repayment.toLocaleString("en-IN")}</span></div>
      <div class="row"><span>Due Date</span><span>${l.due}</span></div>
    `;
    box.appendChild(div);
  });
}

function openLoan(p){
  if(p!=="Candy Park") return;
  selectedLoan=LOANS[0];
  document.getElementById("p-amount").textContent=selectedLoan.repayment.toLocaleString("en-IN");
  document.getElementById("p-date").textContent=selectedLoan.due;
  document.getElementById("pay-amount").textContent=selectedLoan.repayment.toLocaleString("en-IN");
  show("pending");
}

function submit(){
  const utr=document.getElementById("utr").value;
  if(!/^\d{12}$/.test(utr)){alert("UTR must be 12 digits");return;}
  show("success");
}
</script>
</body>
</html>
